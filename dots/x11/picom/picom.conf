# PICOM CONFIG
# Compositor for i3 (dots/x11/i3/config). Carries the decoration options i3
# has no equivalent for: rounding and per-window opacity.

# ===========
# BACKEND
# ===========
backend = "glx";
vsync = true;

# ===========
# ROUNDING
# ===========
corner-radius = 10;

# ===========
# SHADOW
# ===========
shadow = false;

# ===========
# ANIMATIONS
# ===========
fading = false;
animations = ();

# ===========
# BLUR
# ===========
blur-background = false;

# ===========
# RULES
# ===========
rules = (
    { match = "class_g = 'code-oss' || class_g = 'Code'"; opacity = 0.7; },
    { match = "window_type = 'dock' || window_type = 'desktop'"; corner-radius = 0; },
    { match = "fullscreen"; corner-radius = 0; },
);
